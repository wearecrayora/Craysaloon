# Cray Salon - Supabase config.
# Development runs against the HOSTED project (PHASES.md option A, no Docker).
# The [db]/[auth] blocks below describe the local stack and only take effect
# if someone later runs `supabase start`.

project_id = "khabztodwqamgywsfeel"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://join.craysalon.in"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# PUBLIC SIGN-UP IS OFF, AND MUST STAY OFF.
#
# Every account in this system is created by our own server: customers and
# staff by the otp-verify Edge Function after Message Central confirms their
# code (ADR-36), Crayora operators by scripts/console/create-admin.mjs. Nobody
# ever signs themselves up.
#
# Leaving it on is not merely untidy. A public sign-up lets anyone create an
# account at the synthetic address a customer's login will later use - with a
# password THEY know - and have the server adopt it on the customer's first
# login (account pre-hijacking). Computing that address needs the pepper, so
# today that is blocked by one secret; this setting is the second, independent
# layer, and otp-verify refuses to adopt an account it did not create as the
# third.
#
# NOTE, 2026-09-15: this file said `enable_signup = false` under [auth.email]
# while the LIVE project had sign-ups open. config.toml describes the local
# stack; the hosted project is configured in the dashboard, and the two had
# drifted. Check the live value, not this file.
enable_signup = false
enable_anonymous_sign_ins = false

# ---------------------------------------------------------------------------
# No Supabase phone OTP, no Send SMS Hook (ADR-36)
# ---------------------------------------------------------------------------
#
# Message Central VerifyNow generates, sends AND verifies the OTP. It cannot
# deliver a code it did not generate, so Supabase's hook-based delivery could
# never have worked. Supabase issues a session only after Message Central
# confirms, via admin.generateLink + verifyOtp(token_hash).
#
# The phone provider stays disabled so nobody can call signInWithOtp against
# this project directly. There is deliberately no `template` line: RULES 7.2.1
# forbids code that templates an OTP body, and the one that used to be here -
# "Your code is {{ .Code }}" - was exactly that.
[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.email]
enable_signup = false

# Enabled on the LIVE project 2026-09-15 via the Management API, after
# scripts/db/probe-claims-hook.mjs passed. Stamps app_role and salon_id (0034);
# perms and cver are not issued yet. A hook that errors stops every login on
# the project - run the probe after any migration that touches it.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# In config.toml `[functions]` is a MAP OF FUNCTION NAMES, not a section with
# `enabled`. `[functions] enabled = true` once made this whole file unparseable
# and failed CI with nothing but CliConfigParseError to go on.
#
# Both OTP functions run BEFORE anyone is logged in, so there is no user JWT
# for the gateway to check - verify_jwt must be off or no customer could ever
# log in. The functions are their own gate: they refuse a number with no salon
# context, rate-limit per phone and per caller, and check codes only against a
# challenge the server issued.
[functions.otp-send]
verify_jwt = false

[functions.otp-verify]
verify_jwt = false

[storage]
enabled = false  # files live in Cloudflare R2, not Supabase Storage

[analytics]
enabled = false
