# Cray Salon - Supabase config.
# Development runs against the HOSTED project (PHASES.md option A, no Docker).
# The [db]/[auth] blocks below describe the local stack and only take effect
# if someone later runs `supabase start`.

project_id = "khabztodwqamgywsfeel"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://join.craysalon.in"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# Phone OTP via Message Central, delivered through the Send SMS Hook.
# RULES.md 7.4: the hook MUST verify its signature and MUST NOT log the token.
[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your code is {{ .Code }}"

[auth.email]
enable_signup = false

[auth.hook.send_sms]
enabled = false  # flipped on at M3 when the sms-hook function is deployed
uri = "https://khabztodwqamgywsfeel.supabase.co/functions/v1/sms-hook"

[auth.hook.custom_access_token]
enabled = false  # flipped on at M3 - injects app_role / salon_id / perms / cver
uri = "pg-functions://postgres/public/custom_access_token_hook"

# NOTE: there is deliberately no [functions] block. In config.toml `[functions]`
# is a MAP OF FUNCTION NAMES (e.g. [functions.sms-hook] verify_jwt = false), not
# a section with `enabled`. Writing `[functions] enabled = true` makes the whole
# file unparseable - which failed CI at `supabase start` with nothing but
# CliConfigParseError to go on. Per-function config arrives at M3.

[storage]
enabled = false  # files live in Cloudflare R2, not Supabase Storage

[analytics]
enabled = false
