name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub's default shell is `bash -e`, which does NOT set pipefail: in
# `cmd | tee log` the step takes tee's exit code and reports success no matter
# what cmd did. That silently disarmed the release gates once already. Setting
# it here means it cannot be forgotten per step; GATE-6 fails the build if this
# disappears. Deliberately not -u: unset-variable strictness is a separate
# decision and would break steps for unrelated reasons.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  gates:
    name: Structural gates and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural gates (RULES.md)
        run: ./scripts/lint-gates.sh
      - name: Secret scan
        run: ./scripts/secret-scan.sh
      - name: Localisation parity
        run: ./scripts/l10n-check.sh

  design-tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Test
        working-directory: packages/design-tokens
        run: bun test

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f app/pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          channel: stable
          cache: true
      - if: steps.check.outputs.exists == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # The app launches on Android first for cost reasons, but the code must stay
  # iOS-buildable (RULES.md 8.11). Nobody here has a Mac, so this runner IS the
  # iOS compatibility check - without it, breakage is discovered months later.
  #
  # --no-codesign needs no Apple Developer account. macOS runners are free for
  # public repositories; if this repo is ever made private they bill at a 10x
  # multiplier, so revisit then.
  ios:
    name: iOS builds (compatibility only - not shipped yet)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -d app/ios ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          channel: stable
          cache: true
      - if: steps.check.outputs.exists == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --no-codesign --debug

  # RELEASE GATES: cross-tenant isolation, binding exclusivity, money.
  # Never skipped, never deleted, never narrowed to pass (RULES.md 12).
  #
  # This job is also the only place "migrations apply from zero" is verified:
  # development runs against a SHARED hosted project (PHASES.md option A),
  # where proving it would mean dropping everyone's data.
  #
  # Runs against the supabase/postgres image rather than a full `supabase
  # start` stack. The gates need Postgres, pgTAP and the Supabase roles - not
  # Studio, Kong, GoTrue, Realtime or Storage. The full stack failed here four
  # times with no signal beyond "failed", and logs we could not read; this is
  # smaller, faster, and every part of it is something we can reason about.
  # The image tag matches the hosted project's Postgres version.
  database:
    name: Database gates (leak, binding, money)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: supabase/postgres:17.6.1.169
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the runner's dependencies
        working-directory: scripts/db
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Probe the container before touching it
        run: |
          node scripts/db/run.mjs sql "select version()" 2>&1 | tee -a /tmp/ci.log
          node scripts/db/run.mjs sql "select current_user, session_user, usesuper from pg_user where usename = current_user" 2>&1 | tee -a /tmp/ci.log
          node scripts/db/run.mjs sql "select nspname from pg_namespace where nspname in ('auth','extensions','vault','public') order by 1" 2>&1 | tee -a /tmp/ci.log
          node scripts/db/run.mjs sql "select rolname, rolsuper, rolbypassrls from pg_roles where rolname in ('postgres','anon','authenticated','service_role') order by 1" 2>&1 | tee -a /tmp/ci.log
          node scripts/db/run.mjs sql "select name, default_version, installed_version from pg_available_extensions where name = 'pgtap'" 2>&1 | tee -a /tmp/ci.log
          node scripts/db/run.mjs sql "select to_regclass('auth.users') is not null as auth_users_present, has_schema_privilege(current_user, 'auth', 'CREATE') as can_create_in_auth" 2>&1 | tee -a /tmp/ci.log

      - name: Bootstrap the Supabase roles and auth schema
        run: |
          node scripts/db/run.mjs file supabase/ci/bootstrap.sql 2>&1 | tee -a /tmp/ci.log

      - name: Apply every migration FROM ZERO
        # Piped like the rest so a migration failure reaches the diagnostics
        # issue instead of only the Actions log we cannot read.
        run: |
          node scripts/db/run.mjs migrate 2>&1 | tee -a /tmp/ci.log

      - name: Run the release gates
        run: |
          node scripts/db/run.mjs test 2>&1 | tee -a /tmp/ci.log

      # PHASES.md M1: "a deliberately unprotected test table makes it FAIL".
      # Running the gates is half the requirement; proving they can still go
      # red is the half that catches a gate which has quietly stopped working.
      - name: Prove the leak test can fail
        run: |
          node scripts/db/negative-control.mjs 2>&1 | tee -a /tmp/ci.log

      # Actions logs require repo admin, which the developer environment does
      # not have, so a failure here is invisible from outside. Publishing the
      # captured output as an issue makes it readable through the public API.
      # Temporary scaffolding: delete once `gh auth login` is set up locally.
      - name: Publish diagnostics on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Commit: ${{ github.sha }}"
            echo "Run: ${{ github.run_id }}"
            echo
            echo '```'
            tail -c 40000 /tmp/ci.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } > /tmp/body.md
          gh issue create --title "CI database gates failed (${{ github.sha }})"                           --body-file /tmp/body.md --label "" || true
