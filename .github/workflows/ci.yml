name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GitHub's default shell is `bash -e`, which does NOT set pipefail: in
# `cmd | tee log` the step takes tee's exit code and reports success no matter
# what cmd did. That silently disarmed the release gates once already. Setting
# it here means it cannot be forgotten per step; GATE-6 fails the build if this
# disappears. Deliberately not -u: unset-variable strictness is a separate
# decision and would break steps for unrelated reasons.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  gates:
    name: Structural gates and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Structural gates (RULES.md)
        run: ./scripts/lint-gates.sh
      - name: Secret scan
        run: ./scripts/secret-scan.sh
      - name: Localisation parity
        run: ./scripts/l10n-check.sh

  design-tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        working-directory: packages/design-tokens
        run: bun install --frozen-lockfile

      # `bun test` strips types without checking them, so the package shipped
      # two broken imports (Mode from schema.js, where it does not exist) that
      # nothing noticed until the console tried to compile it. Types are half
      # of what this package is - the console and the app share its schema - so
      # the check has to include them.
      - name: Typecheck and test
        working-directory: packages/design-tokens
        run: bun run check

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f app/pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          channel: stable
          cache: true
      - if: steps.check.outputs.exists == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # analyze and test never touch the native half. Since M4 there IS a native
      # half - two method channels, an App Link intent filter and a camera
      # plugin - and a Kotlin or manifest break would otherwise reach a phone
      # before it reached anyone here. Debug, because release signing is M13.
      - name: Android build (the native half analyze cannot see)
        if: steps.check.outputs.exists == 'true'
        working-directory: app
        run: flutter build apk --debug

  # The app launches on Android first for cost reasons, but the code must stay
  # iOS-buildable (RULES.md 8.11). Nobody here has a Mac, so this runner IS the
  # iOS compatibility check - without it, breakage is discovered months later.
  #
  # --no-codesign needs no Apple Developer account. macOS runners are free for
  # public repositories; if this repo is ever made private they bill at a 10x
  # multiplier, so revisit then.
  ios:
    name: iOS builds (compatibility only - not shipped yet)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -d app/ios ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          channel: stable
          cache: true
      - if: steps.check.outputs.exists == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --no-codesign --debug

  # RELEASE GATES: cross-tenant isolation, binding exclusivity, money.
  # Never skipped, never deleted, never narrowed to pass (RULES.md 12).
  #
  # This job is also the only place "migrations apply from zero" is verified:
  # development runs against a SHARED hosted project (PHASES.md option A),
  # where proving it would mean dropping everyone's data.
  #
  # Runs against the supabase/postgres image rather than a full `supabase
  # start` stack. The gates need Postgres, pgTAP and the Supabase roles - not
  # Studio, Kong, GoTrue, Realtime or Storage. The full stack failed here four
  # times with no signal beyond "failed", and logs we could not read; this is
  # smaller, faster, and every part of it is something we can reason about.
  # The image tag matches the hosted project's Postgres version.
  console:
    name: Console (typecheck and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        working-directory: console
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: console
        run: npm run typecheck

      # Money parsing and formatting live here (console/lib/money.ts): the
      # console types prices, setup fees, and the balance a customer is told
      # they are leaving behind. It had no tests at all until 2026-09-27.
      - name: Test
        working-directory: console
        run: npm test

      # The build is the real gate. `server-only` turns "a client component
      # imported the admin database layer" into a build failure, so this is
      # what stops the service-role connection reaching a browser bundle.
      - name: Build
        working-directory: console
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

      # RULES 12 wants the scan run against the CLIENT BUNDLE, not only the
      # repo. A credential does not have to be committed to reach a user - it
      # only has to be read at build time and inlined, which is precisely what
      # a mistyped NEXT_PUBLIC_ variable would do.
      - name: Secret scan the built bundle
        run: ./scripts/secret-scan.sh

  functions:
    name: Edge Functions (deno check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The OTP functions are the only code between a stranger and a login.
      # They were type-checked before the first commit and must stay that way:
      # a type error here is a login that fails in production, or worse, one
      # that succeeds when it should not.
      - name: Type-check
        working-directory: supabase/functions
        run: deno check otp-send/index.ts otp-verify/index.ts create-payment-order/index.ts rzp-webhook/index.ts dispatch-notifications/index.ts

  database:
    name: Database gates (leak, binding, money)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: supabase/postgres:17.6.1.169
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install the runner's dependencies
        working-directory: scripts
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Probe the container before touching it
        run: |
          node scripts/db/run.mjs sql "select version()"
          node scripts/db/run.mjs sql "select current_user, session_user, usesuper from pg_user where usename = current_user"
          node scripts/db/run.mjs sql "select nspname from pg_namespace where nspname in ('auth','extensions','vault','public') order by 1"
          node scripts/db/run.mjs sql "select rolname, rolsuper, rolbypassrls from pg_roles where rolname in ('postgres','anon','authenticated','service_role') order by 1"
          node scripts/db/run.mjs sql "select name, default_version, installed_version from pg_available_extensions where name = 'pgtap'"
          node scripts/db/run.mjs sql "select to_regclass('auth.users') is not null as auth_users_present, has_schema_privilege(current_user, 'auth', 'CREATE') as can_create_in_auth"

      # GoTrue creates auth.sessions at startup; the bare image has no GoTrue,
      # and `postgres` cannot create in its auth schema. The image's superuser
      # shares POSTGRES_PASSWORD. Only this step connects as it.
      - name: Stub the GoTrue-owned auth tables (as supabase_admin)
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@127.0.0.1:5432/postgres
        run: node scripts/db/run.mjs file supabase/ci/auth-stubs.sql

      - name: Bootstrap the Supabase roles and auth schema
        run: node scripts/db/run.mjs file supabase/ci/bootstrap.sql

      - name: Apply every migration FROM ZERO
        # Piped like the rest so a migration failure reaches the diagnostics
        # issue instead of only the Actions log we cannot read.
        run: node scripts/db/run.mjs migrate

      - name: Run the release gates
        run: node scripts/db/run.mjs test

      # PostgreSQL does not check a plpgsql body at CREATE time, so a function
      # naming a column that does not exist is accepted and fails at the first
      # call - in production, on a path nobody clicked. That happened three
      # times in M8 alone. plpgsql_check resolves every statement in every body
      # against the live catalog.
      - name: Static-check every plpgsql function
        run: node scripts/db/plpgsql-check.mjs

      # Four times in M7-M10 a function was correct, gated, and called by
      # nothing that ships - reminders never sent, the wallet never spent,
      # Automations A and C never run, and a Razorpay webhook that could never
      # credit a wallet because it called app.* over PostgREST. Its own gate
      # passed every time, because the gate called it directly. This asks the
      # other question: is it reachable from anything that runs?
      - name: Every function is reachable
        run: node scripts/db/orphan-check.mjs

      # ...and prove the walk still finds an orphan, so a green result above
      # means something.
      - name: Reachability check - negative control
        run: node scripts/db/orphan-check.mjs --canary

      # The claims hook decides what every token carries, and a hook that errors
      # stops EVERY login on the project. Probed here rather than only by hand
      # before enabling it.
      - name: Probe the claims hook
        run: node scripts/db/probe-claims-hook.mjs

      # PHASES.md M1: "a deliberately unprotected test table makes it FAIL".
      # Running the gates is half the requirement; proving they can still go
      # red is the half that catches a gate which has quietly stopped working.
      - name: Prove the leak test can fail
        run: node scripts/db/negative-control.mjs

