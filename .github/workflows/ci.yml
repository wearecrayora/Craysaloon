name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Structural gates and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural gates (RULES.md)
        run: ./scripts/lint-gates.sh
      - name: Secret scan
        run: ./scripts/secret-scan.sh
      - name: Localisation parity
        run: ./scripts/l10n-check.sh

  design-tokens:
    name: Design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Test
        working-directory: packages/design-tokens
        run: bun test

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f app/pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          channel: stable
          cache: true
      - if: steps.check.outputs.exists == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  # The app launches on Android first for cost reasons, but the code must stay
  # iOS-buildable (RULES.md 8.11). Nobody here has a Mac, so this runner IS the
  # iOS compatibility check - without it, breakage is discovered months later.
  #
  # --no-codesign needs no Apple Developer account. macOS runners are free for
  # public repositories; if this repo is ever made private they bill at a 10x
  # multiplier, so revisit then.
  ios:
    name: iOS builds (compatibility only - not shipped yet)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -d app/ios ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          channel: stable
          cache: true
      - if: steps.check.outputs.exists == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --no-codesign --debug

  # RELEASE GATES: cross-tenant isolation, binding exclusivity, money.
  # Never skipped, never deleted, never narrowed to pass (RULES.md 12).
  #
  # This job is also the only place "migrations apply from zero" is verified.
  # Development runs against a SHARED hosted project (PHASES.md option A),
  # where that can never be proven without dropping everyone's data. CI gets a
  # throwaway stack, so it starts empty every time.
  #
  # `supabase start` needs Docker, which GitHub runners have and the developer
  # machine deliberately does not.
  database:
    name: Database gates (leak, binding, money)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start a clean local stack
        run: supabase start

      - name: Install the runner's dependencies
        working-directory: scripts/db
        run: npm install --no-audit --no-fund

      # `supabase start` applies supabase/migrations itself, against a database
      # that begins empty - so starting successfully IS the "applies from zero"
      # gate. Running our own migrate step here would try to re-apply them and
      # fail on `create type ... already exists`.

      - name: Run the release gates
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: node scripts/db/run.mjs test

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup
