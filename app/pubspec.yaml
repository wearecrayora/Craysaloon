name: craysalon
description: "Cray Salon - multi-tenant, white-labelled salon retention app."
publish_to: 'none'

# Bumped on each Play release. See PHASES.md M13.
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # i18n. en / hi / hi_Latn from day one (RULES.md 12A.7, DESIGN.md 5.3).
  flutter_localizations:
    sdk: flutter
  intl: any

  # State. AsyncNotifier for async state; no setState for anything shared
  # (ARCHITECTURE.md 9.1).
  flutter_riverpod: ^3.0.4

  # Tenant-scoped access ONLY through SupabaseGateway in data/remote
  # (RULES.md 3.7 - CI fails the build on .from( elsewhere).
  supabase_flutter: ^2.12.1
  # The branding cache (so the app stays the salon's brand offline, DESIGN 3.3)
  # and the device key the join rate limits are counted against.
  shared_preferences: ^2.5.3

  sentry_flutter: ^9.29.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  # The salon's QR, scanned in-app (IMPLEMENTATION U2). Camera permission
  # denied is a supported path, not an error: manual entry stays.
  mobile_scanner: ^7.4.2

  # The printed QR encodes https://craysalon-join.crayoratech.workers.dev/s/<code>, so an install
  # that already exists opens straight into the join flow with the code filled
  # in. Declared explicitly rather than leaned on as supabase_flutter's
  # transitive dependency.
  app_links: ^7.2.1
  # Opening the published privacy policy, and the salon's own privacy contact
  # (mailto:/tel:). The DPDP notice has to be REACHABLE, not merely printed -
  # a customer on a phone should not have to retype an address to complain.
  # Wrapped in core/platform/external_link.dart, because RULES 15b forbids
  # platform-specific code outside a platform abstraction.
  url_launcher: ^6.3.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  go_router: ^18.0.1
  razorpay_flutter: ^1.4.7
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  # Salon spaces and tools, never people (DESIGN.md 10; credits in the folder).
  assets:
    - assets/images/

  # Required for gen-l10n to run from l10n.yaml.
  generate: true
