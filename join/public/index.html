<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cray Salon</title>
<!--
  The bare domain. Nobody is sent here by a QR - every printed code links to
  /s/<code> - so this exists only for someone who typed the domain, and for
  anything that probes the root. It names no salon and lists none: which salons
  use Cray Salon is their business, not a directory (RULES 2, no cross-tenant
  enumeration).
-->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 32px 20px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #fcfcfb; color: #1a1a19;
  }
  @media (prefers-color-scheme: dark) { body { background: #1a1a19; color: #fff; } }
  main { max-width: 26rem; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
</style>
</head>
<body>
<main>
  <h1>Cray Salon</h1>
  <p>This link opens your salon in the Cray Salon app. Scan the QR code at your
     salon, or ask at the counter for its code.</p>
  <p>Are you a salon owner? Cray Salon is sold and set up by Crayora.</p>
</main>
</body>
</html>
